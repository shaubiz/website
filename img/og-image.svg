<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#ffffff" stroke-opacity=".04" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowBlue">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity=".16"/>
      <stop offset="65%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity=".15"/>
      <stop offset="65%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="80" y1="0" x2="700" y2="0">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0d1117"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1120" cy="560" r="420" fill="url(#glowBlue)"/>
  <circle cx="90" cy="40" r="360" fill="url(#glowViolet)"/>

  <!-- logo mark -->
  <g transform="translate(80,72) scale(1.44)">
    <rect width="32" height="32" rx="7" fill="#1a56db"/>
    <path d="M25 8.4H9.4V16H22.6V23.6H7" fill="none" stroke="#fff" stroke-width="4.8" stroke-linejoin="round" stroke-linecap="butt"/>
  </g>
  <text x="147" y="108" font-family="Bricolage Grotesque" font-weight="700" font-size="30"
        letter-spacing="-.4" fill="#ffffff">Shau Biz Solutions</text>


  <!-- headline -->
  <text x="80" y="292" font-family="Bricolage Grotesque" font-weight="800" font-size="78"
        letter-spacing="-2.2" fill="#ffffff">Practical blockchain</text>
  <text x="80" y="376" font-family="Bricolage Grotesque" font-weight="800" font-size="78"
        letter-spacing="-2.2" fill="url(#accent)">engineering.</text>

  <!-- divider -->
  <rect x="80" y="502" width="1040" height="1" fill="#ffffff" fill-opacity=".1"/>

  <!-- meta row -->
  <text x="80" y="548" font-family="Inter" font-weight="400" font-size="22" fill="#ffffff" fill-opacity=".55">
    Official Routescan Explorer reseller
    <tspan fill-opacity=".25">   ·   </tspan>
    <tspan>Bucharest, Romania</tspan>
  </text>
  <text x="1120" y="548" text-anchor="end" font-family="Inter" font-weight="600" font-size="22" fill="#60a5fa">shaubiz.com</text>
</svg>
